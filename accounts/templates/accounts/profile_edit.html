{% extends "base.html" %}
{% block title %}Edit profile - SecureShare{% endblock %}
{% block content %}
<div class="card">
    <h1>Edit profile</h1>
    <form method="post" enctype="multipart/form-data" class="stacked-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
</div>
{% endblock %}
