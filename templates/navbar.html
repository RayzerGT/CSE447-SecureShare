<nav class="navbar">
    <a href="{% url 'posts:feed' %}" class="brand">SecureShare</a>
    <div class="nav-links">
        {% if user.is_authenticated %}
            <a href="{% url 'posts:feed' %}">Feed</a>
            <a href="{% url 'posts:upload' %}">Upload</a>
            <a href="{% url 'messaging:inbox' %}">Messages</a>
            <a href="{% url 'accounts:sessions' %}">Security</a>
            <a href="{% url 'accounts:profile' %}">{{ user.username }}</a>
            {% if user.is_staff or user.profile.is_admin %}
                <a href="{% url 'moderation:dashboard' %}" class="admin-link">Admin Panel</a>
            {% endif %}
            <form action="{% url 'accounts:logout' %}" method="post" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="link-button">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Login</a>
            <a href="{% url 'accounts:register' %}">Register</a>
        {% endif %}
    </div>
</nav>
