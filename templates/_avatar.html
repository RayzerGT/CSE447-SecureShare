
{% if ring %}<span class="avatar-ring">{% endif %}
<span class="avatar{% if size %} avatar--{{ size }}{% endif %}">
    {% if u.profile.encrypted_avatar_blob %}
        <img src="{% url 'accounts:avatar_image' u.username %}?v={{ u.profile.avatar_mac_tag|slice:':8' }}"
             alt="{{ u.username }}" loading="lazy" decoding="async">
    {% else %}
        {{ u.username|first|upper }}
    {% endif %}
</span>
{% if ring %}</span>{% endif %}
